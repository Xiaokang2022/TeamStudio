<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="description" content="TeamStudio 团队工作室：任务台账、工作量负载、协作日历、红黑榜与邮件提醒" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>星港团队工作室 · TeamStudio</title>
    <script>
      try {
        const saved = localStorage.getItem("teamstudio.theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        // Site default follows the system colour scheme; an explicit local choice wins.
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
